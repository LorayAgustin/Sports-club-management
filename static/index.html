<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión del Club Deportivo</title>
        <link rel="stylesheet" href="styles-dark.css">
    </head>
    <body>
        <header class="header-principal">
            <h1>Gestión de Deportes</h1>
        </header>

        <main class="contenedor-pricipal">
            <!-- SECCIÓN 1: GESTIÓN DE DEPORTES -->
            <section class="tarjeta-seccion">
                <h2>Agregar Nuevo Deporte</h2>
                <form id="form-deporte" class="form-flex">
                    <label for="nombre-deporte">Nombre del Deporte:</label>
                    <input 
                        type="text" 
                        id="nombre-deporte" 
                        name="nombre"
                        placeholder="Ej: Fútbol, Rugby..." 
                        required
                    >
                    <button type="submit" id="agregarDeporte" class="btn-primario">Agregar Deporte</button>
                </form>
            </section>
            <hr>
            <section class="tarjeta-seccion">
                <h2>Listado de Deportes</h2>
                <ul id="lista-deportes" class="lista-flex">
                    <!-- Los <li> se cargarán dinámicamente con JavaScript desde la API REST</li> -->
                </ul>
            </section>
            <!-- SECCIÓN 2: GESTIÓN DE PREDIOS -->
             <!-- SECCIÓN 2: GESTIÓN DE PREDIOS -->
            <section class="tarjeta-seccion">
                <h2>Agregar Nuevo Predio</h2>
                
                <form id="form-predio" class="form-flex">
                    <label for="nombre-predio">Nombre de la Sede/Predio:</label>
                    <input
                        type="text"
                        id="nombre-predio"
                        name="nombre"
                        placeholder="Ej: Sede Central, Predio Norte..."
                        required
                    >

                    <label for="direccion-predio">Dirección:</label>
                    <input
                        type="text"
                        id="direccion-predio"
                        name="direccion"
                        placeholder="Ej: Av. España 1234"
                        required
                    >

                    <button type="submit" id="agregarPredio" class="btn-primario">Agregar Predio</button>
                </form>

                <h2 style="margin-top: 25px;">Listado de Predios</h2>
                <ul id="lista-predios" class="lista-flex">
                    <!-- Se cargan dinámicamente -->
                </ul>
            </section>

        </main>

        <script src="app.js"></script>
    </body>
</html>

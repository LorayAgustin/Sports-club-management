<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión del Club Deportivo</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Gestión de Deportes</h1>
        <section>
            <h2>Agregar Nuevo Deporte</h2>
            <form id="form-deporte">
                <label for="nombre">Nombre del Deporte:</label>
                <input 
                    type="text" 
                    id="nombre-deporte" 
                    name="nombre"
                    placeholder="Ej: Fútbol, Rugby..." 
                    required
                >
                <button type="submit" id="agregarDeporte">Agregar Deporte</button>
            </form>
        </section>
        <hr>
        <section>
            <h2>Listado de Deportes</h2>
            <ul id="lista-deportes">
                <!-- Los <li> se cargarán dinámicamente con JavaScript desde la API REST</li> -->
            </ul>
        </section>
        <script src="app.js"></script>
    </body>
</html>
